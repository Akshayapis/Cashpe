services:
  - type: web
    name: cashpe
    env: docker
    plan: free
    healthCheckPath: /ping.php
    envVars:
      - key: FIREBASE_CREDENTIALS_JSON
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: COMMISSION_PERCENT
        value: "2"
